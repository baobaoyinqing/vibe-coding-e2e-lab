apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: demo
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/CHANGE_ME/CHANGE_ME.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: demo
  namespace: flux-system
spec:
  interval: 1m
  path: ./clusters/kind-demo/apps/demo
  prune: true
  sourceRef:
    kind: GitRepository
    name: demo
  targetNamespace: vibe-lab
